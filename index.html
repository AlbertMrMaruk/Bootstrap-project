<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>13 апреля — 3 года вместе 💛</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <p class="badge">13 апреля</p>
        <h1>3 года отношений с моей невестой</h1>
        <p class="subtitle">
          Мини‑чат о наших самых первых днях общения. Заполни форму — и история
          оживёт 💬
        </p>
      </section>

      <section class="content">
        <div class="chat-card" aria-live="polite">
          <header class="chat-header">
            <h2>Наш чат: первые дни</h2>
            <p id="chatStatus">Ожидаю ответы формы…</p>
          </header>

          <div id="chatWindow" class="chat-window">
            <article class="bubble bubble-left">
              Помнишь, как неловко, но тепло начался наш диалог?
            </article>
            <article class="bubble bubble-right">
              Я сохранил это чувство до сегодняшнего дня ✨
            </article>
          </div>
        </div>

        <form id="memoryForm" class="memory-form">
          <h2>Форма воспоминаний</h2>

          <label for="firstDate">Когда мы впервые написали друг другу?</label>
          <input
            id="firstDate"
            name="firstDate"
            type="text"
            placeholder="Например: 13 апреля 2023"
            required
          />

          <label for="firstTopic">О чём был наш первый разговор?</label>
          <input
            id="firstTopic"
            name="firstTopic"
            type="text"
            placeholder="Например: о музыке и планах на лето"
            required
          />

          <label for="firstEmoji">Какой смайлик был «нашим» в начале?</label>
          <input
            id="firstEmoji"
            name="firstEmoji"
            type="text"
            placeholder="Например: 😊"
            maxlength="8"
            required
          />

          <label for="warmWords">Какие слова ты хочешь оставить в этом дне?</label>
          <textarea
            id="warmWords"
            name="warmWords"
            rows="4"
            placeholder="Пара тёплых строк для нашей истории"
            required
          ></textarea>

          <button type="submit">Показать нашу мини‑переписку</button>
        </form>
      </section>
    </main>

    <script>
      const form = document.getElementById("memoryForm");
      const chatWindow = document.getElementById("chatWindow");
      const chatStatus = document.getElementById("chatStatus");

      const messages = [
        ({ firstDate }) => `— Привет! Мне кажется, ${firstDate} всё и началось.`,
        ({ firstTopic }) => `— А потом мы говорили ${firstTopic} и не заметили время.`,
        ({ firstEmoji }) => `— И этот ${firstEmoji} стал нашим маленьким символом.`,
        ({ warmWords }) => `— ${warmWords}`,
        () =>
          "— Спасибо за эти 3 года. Хочу, чтобы этот чат был только началом новых красивых страниц ❤️",
      ];

      function addBubble(text, side) {
        const bubble = document.createElement("article");
        bubble.className = `bubble ${side}`;
        bubble.textContent = text;
        chatWindow.appendChild(bubble);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const formData = new FormData(form);
        const data = {
          firstDate: formData.get("firstDate").toString().trim(),
          firstTopic: formData.get("firstTopic").toString().trim(),
          firstEmoji: formData.get("firstEmoji").toString().trim(),
          warmWords: formData.get("warmWords").toString().trim(),
        };

        chatWindow.innerHTML = "";
        chatStatus.textContent = "Воспоминания загружены 💛";

        messages.forEach((createMessage, index) => {
          setTimeout(() => {
            addBubble(createMessage(data), index % 2 === 0 ? "bubble-left" : "bubble-right");
          }, 550 * (index + 1));
        });
      });
    </script>
  </body>
</html>
